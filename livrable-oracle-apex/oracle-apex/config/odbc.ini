# À ADAPTER avant le `docker build` : adresse réelle du serveur SQL Server
# distant, port, et nom de la base. Le driver FreeTDS (déclaré dans
# odbcinst.ini) gère la traduction du protocole TDS de SQL Server.
[SQLSERVER_DSN]
Driver      = FreeTDS
Server      = CHANGEZ_MOI_adresse_sql_server
Port        = 1433
Database    = CHANGEZ_MOI_nom_base
TDS_Version = 7.4
